[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-parser"
version = "0.3.0"
description = "arXiv 论文解析与知识提取工具"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "arxiv>=4.0",
    "PyMuPDF>=1.23",
    "tqdm>=4.65",
    "python-dotenv>=1.0",
    "click>=8.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
llm = ["openai", "ollama"]
test = ["pytest>=7.0"]

[project.scripts]
arxiv-parser = "arxiv_parser.__main__:main"

[tool.setuptools]
packages = ["arxiv_parser", "adapters", "adapters.inbound", "adapters.outbound"]

[tool.pytest.ini_options]
testpaths = ["tests"]
